name: Build PlayVideo APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android project
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q *.zip -d project

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build PlayVideo web app
        run: |
          git clone https://github.com/sabujmaity209-source/Playvideo.git web
          cd web
          npm install
          npm run build

      - name: Copy web app into Android
        run: |
          ANDROID_DIR=$(find project -type f -name "settings.gradle" -print -quit | xargs -r dirname)

          mkdir -p "$ANDROID_DIR/app/src/main/assets/public"
          cp -r web/dist/. "$ANDROID_DIR/app/src/main/assets/public/"

          echo "Web files copied successfully:"
          find "$ANDROID_DIR/app/src/main/assets/public" -maxdepth 2 -type f | head -30

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"

      - name: Prepare Android project
        run: |
          ANDROID_DIR=$(find project -type f -name "settings.gradle" -print -quit | xargs -r dirname)

          sed -i "s/compileSdk 34/compileSdk 36/" "$ANDROID_DIR/app/build.gradle"
          sed -i "s/targetSdk 34/targetSdk 36/" "$ANDROID_DIR/app/build.gradle"

          sed -i "/implementation 'com.google.android.material:material:1.11.0'/a\\        implementation 'com.capacitorjs:core:6.1.0'" "$ANDROID_DIR/app/build.gradle"

      - name: Build Release APK
        run: |
          ANDROID_DIR=$(find project -type f -name "settings.gradle" -print -quit | xargs -r dirname)
          cd "$ANDROID_DIR"
          gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PlayVideo-working-APK
          path: '**/build/outputs/apk/release/*.apk'
