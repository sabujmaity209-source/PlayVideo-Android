name: Build PlayVideo AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract AI Studio project
        run: |
          mkdir project
          unzip -q *.zip -d project

          echo "=== ZIP CONTENTS ==="
          unzip -l *.zip | head -100

          echo "=== ANDROID FILES ==="
          find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" \) -print

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"

      - name: Build Release AAB
        run: |
          ANDROID_DIR=$(find project -type f -name "settings.gradle" -print -quit | xargs -r dirname)

          if [ -z "$ANDROID_DIR" ]; then
            echo "ERROR: Android project (settings.gradle) not found in ZIP."
            exit 1
          fi

          echo "Android project: $ANDROID_DIR"
          cd "$ANDROID_DIR"

          gradle bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: PlayVideo-release-AAB
          path: '**/build/outputs/bundle/release/*.aab'
