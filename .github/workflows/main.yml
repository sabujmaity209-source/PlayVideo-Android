name: Build PlayVideo AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract AI Studio project
        run: |
          mkdir project
          unzip -q *.zip -d project

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"

      - name: Prepare Android project
        run: |
          ANDROID_DIR=$(find project -type f -name "settings.gradle" -print -quit | xargs -r dirname)

          if [ -z "$ANDROID_DIR" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          echo "Android project: $ANDROID_DIR"

          sed -i "s/compileSdk 34/compileSdk 36/" "$ANDROID_DIR/app/build.gradle"
          sed -i "s/targetSdk 34/targetSdk 36/" "$ANDROID_DIR/app/build.gradle"

          sed -i "/implementation 'com.google.android.material:material:1.11.0'/a\\        implementation 'com.capacitorjs:core:6.1.0'" "$ANDROID_DIR/app/build.gradle"

          echo "=== SDK ==="
          grep -nE "compileSdk|targetSdk" "$ANDROID_DIR/app/build.gradle"

          echo "=== CAPACITOR ==="
          grep -n "capacitorjs" "$ANDROID_DIR/app/build.gradle"

      - name: Build Release AAB
        run: |
          ANDROID_DIR=$(find project -type f -name "settings.gradle" -print -quit | xargs -r dirname)
          cd "$ANDROID_DIR"
          gradle bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: PlayVideo-release-AAB
          path: '**/build/outputs/bundle/release/*.aab'
