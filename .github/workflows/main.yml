
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract AI Studio project
        run: |
          mkdir project
          unzip -q *.zip -d project
          find project -type f -name gradlew -print

      - name: Build Release AAB
        run: |
          ANDROID_DIR=$(find project -type f -name gradlew | head -1 | xargs dirname)
          echo "Android project: $ANDROID_DIR"
          cd "$ANDROID_DIR"
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: PlayVideo-release-AAB
          path: "**/build/outputs/bundle/release/*.aab"
